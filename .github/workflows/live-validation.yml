name: Daily live validation

on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-validation
  cancel-in-progress: false

jobs:
  record-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install live-validation dependencies
        run: pip install -r requirements-live.txt

      - name: Record immutable forecast
        run: >-
          python generate_long_ideas.py
          --tickers all
          --max-tickers 0
          --days 180
          --workers 8
          --refresh

      - name: Evaluate matured forecasts
        run: >-
          python evaluate_live_predictions.py
          --days 1500
          --workers 8
          --refresh

      - name: Commit new immutable records
        run: |
          mkdir -p data/live_predictions data/live_results
          git add data/live_predictions data/live_results
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record daily live validation"
          git push
